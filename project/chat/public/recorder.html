<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Audio Recorder</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.2s;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        button.record {
            background: #dc3545;
        }

        button.record:hover {
            background: #a71d2a;
        }

        button.recording {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        #status {
            margin: 1rem 0;
            color: #666;
        }

        audio {
            margin-top: 1rem;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🎙️ Voice Recorder</h2>
        <p>Use this if the main chat microphone isn't working.</p>

        <div id="status">Ready to record</div>

        <div>
            <button id="recordBtn" class="record" onclick="toggleRecording()">Start Recording</button>
            <a id="downloadLink" style="display: none;"></a>
        </div>

        <audio id="audioPlayback" controls style="display: none;"></audio>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        async function toggleRecording() {
            const recordBtn = document.getElementById('recordBtn');
            const status = document.getElementById('status');
            const audioPlayback = document.getElementById('audioPlayback');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);

                    mediaRecorder.ondataavailable = (event) => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);

                        audioPlayback.src = audioUrl;
                        audioPlayback.style.display = 'block';

                        // Auto download
                        const link = document.getElementById('downloadLink');
                        link.href = audioUrl;
                        link.download = 'recording_' + new Date().getTime() + '.webm';
                        link.click();

                        status.textContent = "✅ Saved! Drag the file into the chat.";
                    };

                    audioChunks = [];
                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.textContent = "Stop Recording";
                    recordBtn.classList.add('recording');
                    status.textContent = "🔴 Recording...";
                    audioPlayback.style.display = 'none';

                } catch (err) {
                    console.error("Error accessing microphone:", err);
                    status.textContent = "❌ Error: Could not access microphone";
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.textContent = "Start Recording";
                recordBtn.classList.remove('recording');
                status.textContent = "Processing...";
            }
        }
    </script>
</body>

</html>
