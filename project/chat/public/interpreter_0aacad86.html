<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>English Interpreter</title>
    <style>
        :root {
            --bg-color: #1a1b26;
            --card-bg: #24283b;
            --text-color: #a9b1d6;
            --highlight-color: #7aa2f7;
            --active-bg: #3d59a1;
            --active-text: #ffffff;
            --accent: #bb9af7;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: transparent;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: var(--text-color);
        }

        .container {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
            box-sizing: border-box;
        }

        /* Reproductor */
        audio {
            width: 100%;
            height: 40px;
            border-radius: 20px;
            outline: none;
            filter: invert(0.9) hue-rotate(180deg);
            /* Dark mode hack for default player */
        }

        /* Área de Texto */
        .text-box {
            flex: 1;
            overflow-y: auto;
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-color);
            padding-right: 12px;
            white-space: pre-wrap;
            scrollbar-width: thin;
            scrollbar-color: var(--active-bg) transparent;
        }

        .text-box::-webkit-scrollbar {
            width: 6px;
        }

        .text-box::-webkit-scrollbar-track {
            background: transparent;
        }

        .text-box::-webkit-scrollbar-thumb {
            background-color: var(--active-bg);
            border-radius: 3px;
        }

        /* Palabras individuales */
        .word {
            display: inline-block;
            margin-right: 5px;
            padding: 2px 6px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-color);
        }

        .word:hover {
            background: rgba(122, 162, 247, 0.1);
            color: var(--highlight-color);
        }

        /* Highlight Activo */
        .active {
            background-color: var(--active-bg);
            color: var(--active-text);
            font-weight: 600;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(61, 89, 161, 0.4);
        }

        /* --- ESTILOS ESTRUCTURALES --- */
        .title-block {
            display: block;
            width: 100%;
            margin-top: 24px;
            margin-bottom: 12px;
            font-size: 1.3em;
            font-weight: 700;
            color: var(--accent);
            border-bottom: 2px solid var(--active-bg);
            padding-bottom: 4px;
        }

        .list-item {
            display: block;
            width: 100%;
            margin-left: 24px;
            margin-top: 8px;
            position: relative;
        }

        .list-item::before {
            content: "•";
            position: absolute;
            left: -15px;
            color: var(--highlight-color);
        }
    </style>
</head>

    <script>
        const wordMap = [{"word": "I'd be happy to help you with a list of topics for a general conversation.", "start": 0.05, "end": 4.3125}, {"word": "Here are some ideas to get you started:", "start": 4.3125, "end": 6.775}, {"word": "1. Hobbies and interests: What do you enjoy doing in your free time?", "start": 6.775, "end": 11.7125}, {"word": "Do you have any hobbies or interests that you're passionate about?", "start": 11.7125, "end": 14.975000000000001}, {"word": "2. Travel: Have you traveled to any exciting places recently or have any upcoming trips planned?", "start": 14.975, "end": 22.125}, {"word": "What are some of your favorite travel destinations?", "start": 22.125, "end": 25.125}, {"word": "3. Food and drink: What kind of food do you like to eat?", "start": 25.125, "end": 29.4625}, {"word": "Do you have a favorite restaurant or cuisine?", "start": 29.4625, "end": 32.074999999999996}, {"word": "What's your go-to drink order at a coffee shop?", "start": 32.075, "end": 34.8125}, {"word": "4. Work and studies: What do you do for work or study?", "start": 34.8125, "end": 39.1875}, {"word": "What are some of the most interesting or challenging projects you've worked on recently?", "start": 39.1875, "end": 43.6625}, {"word": "5. Family and friends: Who are some of the most important people in your life?", "start": 43.6625, "end": 49.362500000000004}, {"word": "What do you like to do with your family and friends?", "start": 49.3625, "end": 52.025}, {"word": "6. Technology: What kind of technology do you use regularly?", "start": 52.025, "end": 56.875}, {"word": "Do you have a favorite", "start": 56.875, "end": 58.3125}];
        const player = document.getElementById('player');
        const lyrics = document.getElementById('lyrics');

        // Renderizado
        wordMap.forEach((item, index) => {
            const span = document.createElement('span');
            let text = item.word;
            let clean = text.trim();

            span.id = 'w-' + index;
            span.className = 'word';

            // --- DETECCIÓN DE FORMATO ---
            if (clean.startsWith("##") || clean.startsWith("Concept:")) {
                span.classList.add('title-block');
                text = text.replace(/#/g, '').replace('Concept:', '').trim();
            }
            else if (clean.startsWith("-") || clean.startsWith("•") || /^\d+\./.test(clean)) {
                span.classList.add('list-item');
            }

            span.innerText = text + " ";
            span.onclick = () => { player.currentTime = item.start; player.play(); };
            lyrics.appendChild(span);
        });

        // Sincronización
        player.ontimeupdate = () => {
            const t = player.currentTime;
            wordMap.forEach((item, index) => {
                const el = document.getElementById('w-' + index);
                if (el) {
                    if (t >= item.start && t < item.end) {
                        if (!el.classList.contains('active')) {
                            el.classList.add('active');
                            el.scrollIntoView({ behavior: "smooth", block: "center" });
                        }
                    } else {
                        el.classList.remove('active');
                    }
                }
            });
        };
