<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#07060d" />
    <title>MITOS DE COLOMBIA: SANGRE DE LEYENDA</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; background: #07060d; overflow: hidden; }
      #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      /* El contenedor ya centra con flex; el margen de autoCenter de Phaser lo desplazaría el doble. */
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; margin: 0 !important; }
      /* Aviso de carga: solo anima opacidad y transform, que el navegador mueve aunque el juego esté ocupado. */
      #loading { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: rgba(7, 6, 13, 0.92); color: #f8f0d8; font: bold 13px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 3px;
        opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.15s, visibility 0s 0.15s; }
      #loading.on { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity 0.2s 0.12s, visibility 0s; }
      #loading.boot { background: #07060d; transition: none; }
      .loading-dots { display: flex; gap: 8px; }
      .loading-dots i { width: 10px; height: 10px; background: #f8d048; box-shadow: 0 0 10px #f8a830; animation: loading-hop 0.9s steps(3) infinite; will-change: transform, opacity; }
      .loading-dots i:nth-child(2) { animation-delay: 0.15s; }
      .loading-dots i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes loading-hop { 0%, 100% { transform: translateY(0); opacity: 0.35; } 50% { transform: translateY(-8px); opacity: 1; } }
      .loading-label { min-height: 1.4em; color: #c8b890; font-size: 11px; text-align: center; padding: 0 16px; }
      .loading-bar { width: 160px; height: 6px; border: 2px solid #d8b070; padding: 1px; }
      .loading-bar::after { content: ''; display: block; height: 100%; background: #f8d048; transform-origin: left; transform: scaleX(var(--p, 0)); transition: transform 0.15s; }
      .loading-bar[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading" class="on boot" role="status" aria-live="polite">
      <div class="loading-dots"><i></i><i></i><i></i></div>
      <div>CARGANDO</div>
      <div class="loading-bar" hidden></div>
      <div class="loading-label"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
