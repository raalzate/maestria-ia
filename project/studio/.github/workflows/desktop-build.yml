name: Desktop Build

# Builds the self-contained desktop bundle on each OS and (on a version tag)
# publishes them to a GitHub Release. PyInstaller cannot cross-compile, so each
# artifact must be built on its own native runner.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed by the release job to upload assets

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: ddd-studio-macos
          - os: windows-latest
            artifact: ddd-studio-windows
          - os: ubuntu-latest
            artifact: ddd-studio-linux
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.12, not 3.13: best native-wheel coverage for ctranslate2/onnxruntime.
          python-version: "3.12"

      - name: Install Graphviz (macOS)
        if: runner.os == 'macOS'
        run: brew install graphviz

      - name: Install Graphviz + GTK/WebKit (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgtk-3-0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1

      - name: Install Graphviz (Windows)
        if: runner.os == 'Windows'
        run: choco install graphviz -y

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: bash packaging/build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pwsh packaging/build.ps1

      # --- Package one clean archive per OS (avoid uploading the intermediate
      #     onedir + the .app twice on macOS) ---------------------------------
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent "DDD Studio.app" "../${{ matrix.artifact }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.artifact }}.tar.gz" -C dist "DDD Studio"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist/DDD Studio" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
